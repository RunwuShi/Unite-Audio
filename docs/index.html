<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="UNITE-AUDIO: Joint Learning of Continuous Tokenization and Latent Flow Matching for Text-to-Audio Generation"
    />
    <title>UNITE-AUDIO</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <button
      class="icon-button sidebar-toggle"
      id="sidebarToggle"
      type="button"
      aria-label="Open table of contents"
      aria-controls="sidebar"
      aria-expanded="false"
    >
      <span aria-hidden="true">&#9776;</span>
    </button>

    <button
      class="icon-button theme-toggle"
      id="themeToggle"
      type="button"
      aria-label="Switch to dark mode"
    >
      <span id="themeIcon" aria-hidden="true">&#9790;</span>
    </button>

    <aside class="sidebar" id="sidebar" aria-label="Table of contents">
      <div class="sidebar-header">
        <div>
          <p class="sidebar-kicker">UNITE-AUDIO</p>
          <p class="sidebar-title">Contents</p>
        </div>
        <button
          class="sidebar-close"
          id="sidebarClose"
          type="button"
          aria-label="Close table of contents"
        >
          <span aria-hidden="true">&times;</span>
        </button>
      </div>

      <nav class="sidebar-nav" aria-label="Page sections">
        <a class="sidebar-link active" href="#home">Home</a>
        <a class="sidebar-link" href="#caption-audio">Text Caption &amp; Audio</a>
      </nav>
    </aside>

    <button
      class="sidebar-backdrop"
      id="sidebarBackdrop"
      type="button"
      aria-label="Close table of contents"
      tabindex="-1"
    ></button>

    <main class="page-shell">
      <section class="hero" id="home">
        <div class="hero-inner">
          <h1 class="paper-title">
            <span class="paper-name">UNITE-AUDIO</span>
            <span class="paper-subtitle">
              JOINT LEARNING OF CONTINUOUS TOKENIZATION AND<br class="desktop-break" />
              LATENT FLOW MATCHING FOR TEXT-TO-AUDIO GENERATION
            </span>
          </h1>
          <div class="paper-actions" aria-label="Paper links">
            <span class="paper-action" aria-disabled="true">arXiv</span>
          </div>
        </div>
      </section>

      <div class="section-rule" aria-hidden="true">
        <span></span>
      </div>

      <section class="content-section" id="caption-audio" aria-labelledby="caption-audio-title">
        <div class="section-heading">
          <p class="section-index">01</p>
          <h2 id="caption-audio-title">Text Caption &amp; Audio</h2>
        </div>

        <div class="samples-stage" id="samplesGrid" aria-label="Text caption and audio examples">
          <!--
            Future sample markup:
            <article class="sample-card">
              <p class="sample-caption">Text caption</p>
              <audio controls preload="none" src="audio/example.wav"></audio>
            </article>
          -->
        </div>
      </section>
    </main>

    <script>
      const body = document.body;
      const sidebar = document.getElementById("sidebar");
      const sidebarToggle = document.getElementById("sidebarToggle");
      const sidebarClose = document.getElementById("sidebarClose");
      const sidebarBackdrop = document.getElementById("sidebarBackdrop");
      const themeToggle = document.getElementById("themeToggle");
      const themeIcon = document.getElementById("themeIcon");
      const sidebarLinks = [...document.querySelectorAll(".sidebar-link")];
      const desktopSidebar = window.matchMedia("(min-width: 1180px)");

      const savedTheme = localStorage.getItem("unite-audio-theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;

      if (savedTheme === "dark" || (!savedTheme && prefersDark)) {
        body.classList.add("dark-mode");
      }

      function updateThemeButton() {
        const isDark = body.classList.contains("dark-mode");
        themeIcon.innerHTML = isDark ? "&#9728;" : "&#9790;";
        themeToggle.setAttribute(
          "aria-label",
          isDark ? "Switch to light mode" : "Switch to dark mode",
        );
      }

      function setSidebar(open) {
        const isDesktop = desktopSidebar.matches;
        sidebar.classList.toggle("open", open);
        sidebarBackdrop.classList.toggle("visible", open && !isDesktop);
        sidebarToggle.setAttribute("aria-expanded", String(open));
        sidebarToggle.setAttribute(
          "aria-label",
          open ? "Close table of contents" : "Open table of contents",
        );
        body.classList.toggle("sidebar-open", open && !isDesktop);
      }

      updateThemeButton();
      setSidebar(false);

      themeToggle.addEventListener("click", () => {
        body.classList.toggle("dark-mode");
        localStorage.setItem(
          "unite-audio-theme",
          body.classList.contains("dark-mode") ? "dark" : "light",
        );
        updateThemeButton();
      });

      sidebarToggle.addEventListener("click", () => {
        setSidebar(!sidebar.classList.contains("open"));
      });

      sidebarClose.addEventListener("click", () => setSidebar(false));
      sidebarBackdrop.addEventListener("click", () => setSidebar(false));

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          setSidebar(false);
        }
      });

      sidebarLinks.forEach((link) => {
        link.addEventListener("click", () => {
          sidebarLinks.forEach((item) => item.classList.remove("active"));
          link.classList.add("active");
          if (!desktopSidebar.matches) {
            setSidebar(false);
          }
        });
      });

      desktopSidebar.addEventListener("change", () => {
        setSidebar(false);
      });

      const sections = [...document.querySelectorAll("main section[id]")];
      const sectionObserver = new IntersectionObserver(
        (entries) => {
          const visibleEntry = entries
            .filter((entry) => entry.isIntersecting)
            .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];

          if (!visibleEntry) return;

          sidebarLinks.forEach((link) => {
            link.classList.toggle(
              "active",
              link.getAttribute("href") === `#${visibleEntry.target.id}`,
            );
          });
        },
        { rootMargin: "-20% 0px -60%", threshold: [0.05, 0.25, 0.5] },
      );

      sections.forEach((section) => sectionObserver.observe(section));
    </script>
  </body>
</html>
